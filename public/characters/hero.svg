<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" fill="none">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7bbff"/>
      <stop offset="1" stop-color="#9575f4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6d8"/>
      <stop offset="1" stop-color="#e6cdb4"/>
    </linearGradient>
  </defs>
  <!-- Placeholder Rocket Agency 3D mascot. Replace with /public/characters/hero.webp -->
  <!-- legs (black cargo) -->
  <rect x="250" y="560" width="60" height="200" rx="26" fill="#201f2a"/>
  <rect x="330" y="560" width="60" height="200" rx="26" fill="#201f2a"/>
  <!-- shoes -->
  <rect x="236" y="748" width="92" height="40" rx="20" fill="#f6f1ea"/>
  <rect x="322" y="748" width="92" height="40" rx="20" fill="#f6f1ea"/>
  <rect x="236" y="768" width="92" height="16" rx="8" fill="#9575f4"/>
  <rect x="322" y="768" width="92" height="16" rx="8" fill="#9575f4"/>
  <!-- body / hoodie -->
  <rect x="205" y="330" width="230" height="260" rx="70" fill="url(#hoodie)"/>
  <!-- pocket -->
  <rect x="255" y="470" width="130" height="70" rx="26" fill="#8a68ec" opacity="0.55"/>
  <!-- hood -->
  <ellipse cx="320" cy="330" rx="150" ry="60" fill="url(#hoodie)"/>
  <!-- head -->
  <circle cx="320" cy="215" r="120" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M205 200c0-78 52-132 115-132s115 54 115 132c0 18-6 33-6 33-14-40-40-58-40-58-30 30-84 30-138 6 0 0-20 12-40 52-4-12-6-22-6-33Z" fill="#1c1b22"/>
  <!-- eyes -->
  <circle cx="278" cy="215" r="24" fill="#ffffff"/>
  <circle cx="362" cy="215" r="24" fill="#ffffff"/>
  <circle cx="282" cy="219" r="13" fill="#1c1b22"/>
  <circle cx="366" cy="219" r="13" fill="#1c1b22"/>
  <circle cx="287" cy="214" r="4" fill="#ffffff"/>
  <circle cx="371" cy="214" r="4" fill="#ffffff"/>
  <!-- smile -->
  <path d="M298 262c14 14 30 14 44 0" stroke="#b07a5a" stroke-width="6" stroke-linecap="round"/>
  <!-- brand text on hoodie -->
  <text x="320" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.85">ROCKET</text>
  <text x="320" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.85">AGENCY</text>
</svg>
